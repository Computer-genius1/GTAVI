name: Windows build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore GTAVI.sln

      - name: Build
        run: dotnet build GTAVI.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test GTAVI.sln --configuration Release --no-build --verbosity normal
