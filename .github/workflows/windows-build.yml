name: Windows build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore GTAVI.sln

      - name: Build
        run: dotnet build GTAVI.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test GTAVI.sln --configuration Release --no-build --verbosity normal

      - name: Publish Windows x64 preview
        run: dotnet publish src/GTAVI.Windows/GTAVI.Windows.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true --output artifacts/publish/win-x64

      - name: Package Windows x64 preview
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/packages | Out-Null
          Compress-Archive -Path artifacts/publish/win-x64/* -DestinationPath artifacts/packages/GTAVI-Windows-Readiness-win-x64.zip -Force

      - name: Upload Windows x64 preview
        uses: actions/upload-artifact@v4
        with:
          name: GTAVI-Windows-Readiness-win-x64
          path: artifacts/packages/GTAVI-Windows-Readiness-win-x64.zip
          if-no-files-found: error
          retention-days: 14
